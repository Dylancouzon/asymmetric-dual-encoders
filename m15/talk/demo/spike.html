<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Traffic Spike</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#090c14;--panel:#111827;--line:#262c3d;--txt:#f0f3fa;--mut:#9aa0b5;--ok:#3fc1a5;--bad:#ff516b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:"Mona Sans",-apple-system,Segoe UI,Arial,sans-serif}
.wrap{padding:36px 48px;display:grid;grid-template-rows:auto auto 1fr;gap:28px;height:100vh}
h1{font-size:40px;margin:0;font-weight:650}h1 small{font-size:26px;color:var(--mut);font-weight:400;margin-left:16px}
.big{display:grid;grid-template-columns:1fr 1.3fr 1.5fr 1fr;gap:20px}
.n{background:var(--panel);border-radius:20px;padding:20px 28px}
.n .k{font-size:24px;color:var(--mut)}.n .v{font-size:76px;font-weight:700;line-height:1.05;white-space:nowrap}
.n .d{font-size:22px;color:var(--mut)}
.main{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;min-height:0}
.panel{background:var(--panel);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;min-height:0}
.panel .k{font-size:24px;color:var(--mut);margin-bottom:8px}
canvas{flex:1;width:100%;min-height:0}
.row{display:grid;grid-template-columns:200px 130px 1fr 90px;align-items:center;gap:16px;font-size:30px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .bar{height:34px;background:#0b0f19;border-radius:8px;overflow:hidden}.row .fill{height:100%;border-radius:8px;display:block}
.row b{font-weight:700}.row .q{color:var(--mut);text-align:right}
.head{font-size:20px;color:var(--mut);border-bottom:none;padding:0}
.running{font-size:24px;color:#f5a623;margin-top:12px}
</style></head><body><div class="wrap">
<h1>Traffic spike <small id="sub"></small></h1>
<div class="big">
  <div class="n"><div class="k">traffic</div><div class="v" id="rate">–</div><div class="d">queries per second</div></div>
  <div class="n"><div class="k">query encoder</div><div class="v" id="enc">–</div><div class="d" id="encd"></div></div>
  <div class="n"><div class="k">answered in time</div><div class="v" id="good">–</div><div class="d" id="goodd"></div></div>
  <div class="n"><div class="k">ranking quality</div><div class="v" id="ndcg">–</div><div class="d">nDCG@10</div></div>
</div>
<div class="main">
  <div class="panel"><div class="k">answered in time, last minute</div><canvas id="c"></canvas></div>
  <div class="panel"><div class="k">same traffic, replayed for each encoder</div>
    <div class="row head"><span></span><span>traffic</span><span>answered in time</span><span class="q">nDCG</span></div>
    <div id="board"></div><div class="running" id="running"></div></div>
</div></div>
<script>
const WIN = 60; let H = [];
const COL = {stella: "#c9cede", nano: "#9494ff", zero: "#ff516b", "zero-fast": "#ff8fa0", auto: "#3fc1a5"};
const NAME = {stella: "Stella", nano: "Nano", zero: "Zero"};
const SHORT = {stella: "Stella", nano: "Nano", zero: "Zero", "zero-fast": "Zero narrow", auto: "Auto"};
const LOW = 40, STEPS = [10, 20, 40, 80, 160, 320, 640, 800, 1000, 1500, 2000];
const post = (path, p) => fetch(path + (p ? "?" + new URLSearchParams(p) : ""), {method: "POST"});
// Keyboard only, so the screen stays clean: 1 Stella, 2 Nano, 3 Zero, 4 Zero narrow, 5 Auto,
// S spike x25 / back, T trial, arrows step the traffic, C clear queue, U clear the scoreboard.
let pendingRate = null;
addEventListener("keydown", e => {
  const m = {"1": "stella", "2": "nano", "3": "zero", "4": "zero-fast", "5": "auto"}[e.key];
  const r = pendingRate || (H.length ? H[H.length - 1].rate : LOW);
  const setRate = v => { pendingRate = v; post("/set", {rate: v}); };
  if (m) post("/set", {mode: m});
  if (e.key === "s") setRate(r > LOW * 2 ? LOW : LOW * 25);
  if (e.key === "t") post("/trial");
  if (e.key === "c") post("/reset");
  if (e.key === "u") post("/unpin");
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    const up = e.key === "ArrowUp", next = up ? STEPS.find(x => x > r + 0.5) : [...STEPS].reverse().find(x => x < r - 0.5);
    if (next) setRate(next); e.preventDefault(); }
});
function draw() {
  if (!H.length) return;
  const c = document.getElementById("c"), rc = c.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (c.width !== Math.round(rc.width * d) || c.height !== Math.round(rc.height * d)) { c.width = rc.width * d; c.height = rc.height * d; }
  const x = c.getContext("2d"), w = rc.width, h = rc.height, now = H[H.length - 1].t;
  x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, w, h);
  const L = 70, tx = t => L + (w - L) * (1 - (now - t) / WIN), fy = v => h - 10 - v / 100 * (h - 54);
  let start = 0;     // one shaded band per encoder period, labeled with its name
  for (let i = 1; i <= H.length; i++) {
    if (i === H.length || H[i].mode !== H[start].mode) {
      const m = H[start].mode, x0 = tx(H[start].t), x1 = tx(H[i - 1].t);
      x.fillStyle = COL[m] + "26"; x.fillRect(x0, 0, x1 - x0 + 1, h);
      if (x1 - x0 > 90) { x.fillStyle = COL[m]; x.font = "600 26px -apple-system, sans-serif"; x.fillText(SHORT[m], x0 + 10, 30); }
      start = i;
    }
  }
  x.font = "22px -apple-system, sans-serif"; x.fillStyle = "#9aa0b5"; x.strokeStyle = "#262c3d"; x.lineWidth = 1;
  for (const v of [0, 50, 100]) { x.beginPath(); x.moveTo(L, fy(v)); x.lineTo(w, fy(v)); x.stroke(); x.fillText(v + "%", 0, fy(v) + 8); }
  x.strokeStyle = "#fcfdff"; x.lineWidth = 5; x.beginPath();
  H.forEach((s, i) => i ? x.lineTo(tx(s.t), fy(s.good_pct)) : x.moveTo(tx(s.t), fy(s.good_pct))); x.stroke();
}
async function tick() {
  try {
    const s = await (await fetch("/stats")).json(); H = s.history.filter(v => s.t - v.t <= WIN);
    if (pendingRate && Math.abs(s.rate - pendingRate) < 0.5) pendingRate = null;
    const el = id => document.getElementById(id);
    el("sub").textContent = `${(s.n_docs / 1e6).toFixed(2)}M passages · one Stella index · this laptop`;
    el("rate").textContent = Math.round(s.rate).toLocaleString();
    el("enc").textContent = SHORT[s.mode]; el("enc").style.color = COL[s.mode];
    const tot = s.mix.stella + s.mix.nano + s.mix.zero || 1;
    el("encd").textContent = s.mode === "auto" ? ["stella", "nano", "zero"].filter(k => s.mix[k]).map(k => `${Math.round(100 * s.mix[k] / tot)}% ${NAME[k]}`).join(" · ") : "";
    el("good").textContent = Math.round(s.good_pct) + "%"; el("good").style.color = s.good_pct < 50 ? "var(--bad)" : "var(--ok)";
    el("goodd").textContent = `relevant result in the top 10, under ${s.budget_ms} ms`;
    el("ndcg").textContent = s.ndcg10.toFixed(2);
    el("board").innerHTML = s.pins.filter(p => p.trial).map(p => `<div class="row"><span style="color:${COL[p.mode]}"><b>${SHORT[p.mode]}</b></span>
      <span>${Math.round(p.rate).toLocaleString()}/s</span>
      <span style="display:flex;align-items:center;gap:12px"><span class="bar" style="flex:1"><span class="fill" style="width:${p.good_pct}%;background:${p.good_pct < 50 ? "#ff516b" : "#3fc1a5"}"></span></span><b>${Math.round(p.good_pct)}%</b></span>
      <span class="q">${p.ndcg10.toFixed(2)}</span></div>`).join("");
    el("running").textContent = s.trial_left > 0 ? `replaying the same traffic… ${Math.ceil(s.trial_left)} s` : "";
    draw();
  } catch (e) {}
  setTimeout(tick, 250);
}
addEventListener("resize", draw); tick();
</script></body></html>
